name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Workaround for npm/cli#4828: optional platform-specific rollup
      # binaries are sometimes skipped during `npm ci`, which makes Vitest
      # crash with "Cannot find module @rollup/rollup-linux-x64-gnu".
      # Install the linux binary explicitly so the test step always works.
      - name: Install rollup linux binary (npm/cli#4828 workaround)
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Lint mobile
        run: npm run mobile:lint

      - name: Typecheck mobile
        run: npm run mobile:typecheck

      - name: Lint admin
        run: npm run lint --workspace=apps/admin

      - name: Run admin proxy rule tests
        run: npm run admin:proxy:rules

      - name: Lint marketing
        run: npm run lint --workspace=apps/marketing

      - name: Run unit tests
        run: npm run test

  content-quality:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run content audit rule tests
        run: npm run content:audit:rules

      - name: Run content import rule tests
        run: npm run content:import:rules

      - name: Run admin import UI regression tests
        run: npm run content:admin-import:ui

      - name: Run live content audit gate
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run content:audit:ci

      - name: Upload content audit report
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-report
          path: |
            audit/content-quality-report.md
            audit/content-quality-report.json

      - name: Skip live content audit gate
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "::warning::Skipping live content audit. Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets to enable it."

  admin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run admin e2e smoke tests
        run: npm run admin:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-playwright-report
          path: apps/admin/playwright-report
          if-no-files-found: ignore

  web-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin and marketing apps
        run: npm run web:build

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase db start

      - name: Apply migrations locally
        run: supabase db reset --no-seed

      # `db lint` is opinionated and returns non-zero on warnings (e.g. unused
      # indexes, RLS on system tables). Surface them but don't fail the build —
      # the real schema check is `db reset` above (which fails on broken SQL).
      - name: Lint database (advisory)
        run: supabase db lint --local || echo "::warning::supabase db lint reported warnings (advisory, non-blocking)"
