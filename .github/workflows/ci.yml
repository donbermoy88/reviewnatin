name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Workaround for npm/cli#4828: optional platform-specific rollup
      # binaries are sometimes skipped during `npm ci`, which makes Vitest
      # crash with "Cannot find module @rollup/rollup-linux-x64-gnu".
      # Install the linux binary explicitly so the test step always works.
      - name: Install rollup linux binary (npm/cli#4828 workaround)
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Lint mobile
        run: npm run mobile:lint

      - name: Lint admin
        run: npm run lint --workspace=apps/admin

      - name: Lint marketing
        run: npm run lint --workspace=apps/marketing

      - name: Run unit tests
        run: npm run test

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase db start

      - name: Apply migrations locally
        run: supabase db reset --no-seed

      # `db lint` is opinionated and returns non-zero on warnings (e.g. unused
      # indexes, RLS on system tables). Surface them but don't fail the build —
      # the real schema check is `db reset` above (which fails on broken SQL).
      - name: Lint database (advisory)
        run: supabase db lint --local || echo "::warning::supabase db lint reported warnings (advisory, non-blocking)"
