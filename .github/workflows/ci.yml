name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint mobile
        run: npm run mobile:lint

      - name: Lint admin
        run: npm run lint --workspace=apps/admin

      - name: Lint marketing
        run: npm run lint --workspace=apps/marketing

      - name: Run unit tests
        run: npm run test

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase db start

      - name: Apply migrations locally
        run: supabase db reset --no-seed

      - name: Lint database (local)
        run: supabase db lint --local
