name: Deploy Marketing

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/marketing/**'
      - 'packages/shared/**'
      - '.github/workflows/marketing-deploy.yml'

concurrency:
  group: marketing-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build marketing site
        run: npm run build --workspace=apps/marketing
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketing-next-build
          path: apps/marketing/.next
          if-no-files-found: error

  # Wire your host (Vercel, Cloudflare Pages, etc.) to consume the artifact or run `next start` on a VM.
  # Secrets required: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
