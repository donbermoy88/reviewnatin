name: Android Beta Release

on:
  workflow_dispatch:
    inputs:
      skip_eas_build:
        description: Skip EAS build (use existing APK in dist/)
        type: boolean
        default: false

jobs:
  beta-automate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Supabase env
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            printf 'SUPABASE_ACCESS_TOKEN=%s\nSUPABASE_PROJECT_ID=%s\n' \
              "$SUPABASE_ACCESS_TOKEN" "$SUPABASE_PROJECT_ID" > .env.supabase
          fi

      - name: Expo/EAS login
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            cd apps/mobile && npx eas-cli whoami
          else
            echo "EXPO_TOKEN not set — EAS build will be skipped"
          fi

      - name: Run beta automation
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.skip_eas_build }}" = "true" ]; then FLAGS="$FLAGS --skip-build"; fi
          if [ -z "$EXPO_TOKEN" ]; then FLAGS="$FLAGS --skip-build"; fi
          FLAGS="$FLAGS --skip-emulator --skip-push"
          node scripts/beta-automate-all.mjs $FLAGS

      - name: Upload beta artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-dist
          path: dist/beta/
          if-no-files-found: ignore
