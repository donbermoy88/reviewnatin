name: Vercel Preview

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_GIT_REF: ${{ github.event.pull_request.head.sha }}
  VERCEL_DEPLOY_TARGET: preview

jobs:
  preview:
    name: Git preview (marketing + admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Deploy preview builds from PR head
        id: deploy
        run: python3 scripts/vercel-git-deploy.py

      - name: Comment preview URLs on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marketing = 'https://reviewnatin-marketing.vercel.app';
            const admin = 'https://reviewnatin-admin.vercel.app/login';
            const body = [
              '### Vercel preview deploys triggered',
              `- Marketing: ${marketing}`,
              `- Admin: ${admin}/login`,
              '',
              `Commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
