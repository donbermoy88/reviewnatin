name: Keep Supabase Alive

# Free Supabase projects can be paused after inactivity. This workflow creates
# real external activity by querying a public PostgREST table several times a
# day. It intentionally runs outside Supabase, so the schedule is independent
# of the Supabase project itself.
#
# Required GitHub secret:
# - REVIEWNATIN_PH_SUPABASE_ANON_KEY
#   Supabase Dashboard -> ReviewNatin PH (tirxigmycjuhaecmbygs)
#   Project Settings -> API -> Project API keys -> anon public
#
# Optional GitHub secret:
# - APP_LINKED_SUPABASE_ANON_KEY
#   Only set this if the mobile app remains linked to yohewfdafdmwntsbzgxx.

on:
  schedule:
    # Four times per day. This is intentionally much more frequent than the
    # 7-day inactivity window to cover delayed or skipped GitHub cron runs.
    - cron: '11 0 * * *'
    - cron: '11 6 * * *'
    - cron: '11 12 * * *'
    - cron: '11 18 * * *'
  workflow_dispatch:

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping-reviewnatin-ph:
    name: Keep ReviewNatin PH Supabase project active
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Query ReviewNatin PH database through PostgREST
        env:
          SUPABASE_URL: https://tirxigmycjuhaecmbygs.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.REVIEWNATIN_PH_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing REVIEWNATIN_PH_SUPABASE_ANON_KEY. Add it in GitHub repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          URL="${SUPABASE_URL}/rest/v1/subscription_products?select=id,sku&limit=1"
          echo "Querying ReviewNatin PH Supabase project at ${SUPABASE_URL}"
          HTTP_CODE="$(
            curl --silent --show-error --location \
              --max-time 30 \
              --output /tmp/supabase-keepalive.json \
              --write-out "%{http_code}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "Accept: application/json" \
              "${URL}"
          )"

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/supabase-keepalive.json
          echo

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Supabase keepalive failed for tirxigmycjuhaecmbygs. Expected 2xx from PostgREST database query."
            exit 1
          fi

          echo "ReviewNatin PH Supabase keepalive succeeded at $(date -u '+%Y-%m-%d %H:%M:%S UTC')."

  ping-app-linked-project:
    name: Keep app-linked Supabase project active if configured
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Query app-linked database if optional secret exists
        env:
          SUPABASE_URL: https://yohewfdafdmwntsbzgxx.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.APP_LINKED_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::notice::APP_LINKED_SUPABASE_ANON_KEY is not set. Skipping optional app-linked project keepalive."
            exit 0
          fi

          URL="${SUPABASE_URL}/rest/v1/subscription_products?select=id,sku&limit=1"
          echo "Querying optional app-linked Supabase project at ${SUPABASE_URL}"
          HTTP_CODE="$(
            curl --silent --show-error --location \
              --max-time 30 \
              --output /tmp/supabase-keepalive-app-linked.json \
              --write-out "%{http_code}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "Accept: application/json" \
              "${URL}"
          )"

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/supabase-keepalive-app-linked.json
          echo

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Optional app-linked Supabase keepalive failed for yohewfdafdmwntsbzgxx."
            exit 1
          fi

          echo "Optional app-linked Supabase keepalive succeeded at $(date -u '+%Y-%m-%d %H:%M:%S UTC')."

  repo-heartbeat:
    name: Repo heartbeat to keep scheduled workflows enabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit heartbeat only if repo has been quiet for 25+ days
        run: |
          set -euo pipefail

          LAST_COMMIT_TS="$(git log -1 --format=%ct)"
          NOW_TS="$(date -u +%s)"
          AGE_DAYS="$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))"
          echo "Last repository activity was ${AGE_DAYS} day(s) ago."

          if [ "${AGE_DAYS}" -lt 25 ]; then
            echo "Repository is active. No heartbeat commit needed."
            exit 0
          fi

          mkdir -p .github
          echo "Last automated keepalive heartbeat: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive-heartbeat.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-heartbeat.txt
          git commit -m "chore(ci): keep scheduled keepalive active [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
