name: Keep Supabase Alive

# Supabase's free tier pauses a project after 7 days of inactivity, where
# "activity" means real requests that reach the database. This workflow runs
# multiple times a day and executes an actual SELECT against a real table so
# the project is genuinely exercised — not just the API gateway pinged.
#
# DESIGN DECISION — this workflow ALWAYS exits 0.
# Its purpose is "best effort" prevention of an auto-pause. If a single ping
# fails (network blip, transient gateway error, missing secret) that is NOT a
# CI failure worth emailing about — it would just spam the inbox. Every
# non-success state becomes a ::warning:: visible in the Actions tab instead.
# Combined with `continue-on-error` at the job level, this guarantees the run
# is reported as SUCCESS no matter what, so you never get a failure email.

on:
  schedule:
    # Four times a day, spread across the clock. Far more than the 7-day
    # window requires — the redundancy covers GitHub's habit of delaying or
    # occasionally dropping individual scheduled runs under load.
    - cron: '0 1 * * *'   # 01:00 UTC
    - cron: '0 7 * * *'   # 07:00 UTC
    - cron: '0 13 * * *'  # 13:00 UTC
    - cron: '0 19 * * *'  # 19:00 UTC
  workflow_dispatch: # Allow manual trigger from the GitHub UI

# Permissions are granted per-job below (least privilege). The ping job needs
# nothing; the heartbeat job needs contents:write to push its timestamp commit.

jobs:
  ping:
    name: Ping Supabase — ReviewNatin PH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true # never mark the run as failed
    permissions: {} # curl needs no repo permissions

    steps:
      - name: Ping a real table (best effort, never fails the job)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Explicitly turn OFF errexit. We handle every branch ourselves and
          # guarantee a clean exit 0 at the end.
          set +e

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY secret not set. Add them at Settings → Secrets and variables → Actions. Skipping ping."
            exit 0
          fi

          BASE="${SUPABASE_URL%/}"

          # Query a real table so the request reaches Postgres (genuine DB
          # activity). 'questions' is a stable, anon-readable catalog table.
          # We try a couple of fallbacks in case the schema changes, then fall
          # back to the auth health endpoint which always touches the project.
          ping_endpoint() {
            curl -s -o /dev/null -m 30 -w "%{http_code}" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$1"
          }

          STATUS=""
          for PATH_TRY in \
            "/rest/v1/questions?select=id&limit=1" \
            "/rest/v1/flashcards?select=id&limit=1" \
            "/auth/v1/health"
          do
            URL="$BASE$PATH_TRY"
            STATUS=$(ping_endpoint "$URL")
            CURL_EXIT=$?
            echo "Tried $URL -> curl exit $CURL_EXIT, HTTP $STATUS  ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
            # A 2xx means a real query ran successfully — best possible signal.
            if [ "$CURL_EXIT" -eq 0 ] && [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "✅ Supabase project is active (real query succeeded)."
              exit 0
            fi
            # 401/403/404/406 still mean the request reached the project and
            # was processed — that counts as activity. Treat as success too.
            if [ "$CURL_EXIT" -eq 0 ] && { [ "$STATUS" -eq 401 ] || [ "$STATUS" -eq 403 ] || [ "$STATUS" -eq 404 ] || [ "$STATUS" -eq 406 ]; }; then
              echo "✅ Supabase project is reachable (HTTP $STATUS — request reached the project, counts as activity)."
              exit 0
            fi
          done

          # If we got here every attempt failed to confirm reachability.
          # 503/504/000 typically mean a paused project or transient gateway
          # issue. Emit a warning (NOT a failure) and let the next scheduled
          # run retry — we run 4×/day so a single miss is harmless.
          echo "::warning::Could not confirm Supabase is reachable (last HTTP $STATUS). The project may be paused or there was a transient network issue. Unpause at https://supabase.com/dashboard/project/yohewfdafdmwntsbzgxx — keep-alive retries automatically on the next schedule."
          exit 0

  # ---------------------------------------------------------------------------
  # Heartbeat: defeat GitHub's "disable scheduled workflows after 60 days of no
  # repository activity" rule WITHOUT any external service or your machine.
  #
  # It commits a one-line timestamp ONLY when the repo has been silent for 25+
  # days. While you commit normally this NEVER fires (zero history noise). If
  # the project is ever left untouched, it auto-commits to reset GitHub's
  # inactivity clock, so the scheduled pings above keep running forever.
  # Like the ping job, it can never fail the run.
  # ---------------------------------------------------------------------------
  heartbeat:
    name: Repo heartbeat (anti auto-disable)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    if: github.event_name == 'schedule' # only on the cron, not manual runs
    permissions:
      contents: write # needed to push the timestamp commit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit a timestamp only if the repo has been quiet for 25+ days
        run: |
          set +e

          # Age (in days) of the most recent commit on this branch.
          LAST_COMMIT_TS=$(git log -1 --format=%ct 2>/dev/null)
          NOW_TS=$(date -u +%s)
          if [ -z "$LAST_COMMIT_TS" ]; then
            echo "::warning::Could not read last commit time; skipping heartbeat."
            exit 0
          fi
          AGE_DAYS=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          echo "Last repo activity was $AGE_DAYS day(s) ago."

          if [ "$AGE_DAYS" -lt 25 ]; then
            echo "Repo is active — no heartbeat commit needed."
            exit 0
          fi

          echo "Repo has been quiet for $AGE_DAYS days — writing heartbeat to keep the schedule alive."
          mkdir -p .github
          echo "Last automated keep-alive heartbeat: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive-heartbeat.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-heartbeat.txt
          git commit -m "chore(ci): keep-alive heartbeat [skip ci]" || { echo "Nothing to commit."; exit 0; }

          # Rebase-pull guards against a race, then push. Any failure is a
          # warning, never a job failure.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" 2>/dev/null
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "✅ Heartbeat committed — GitHub's 60-day inactivity timer is reset."
          else
            echo "::warning::Heartbeat push failed (permissions or branch protection?). The 4x/day pings still ran; only the long-term auto-disable guard is affected."
          fi
          exit 0
