name: Keep Supabase Alive

# Free Supabase projects can be paused after inactivity, which breaks Auth,
# PostgREST, Edge Functions, Storage, and the mobile app. This workflow creates
# real external activity by querying a public PostgREST table several times a
# day. It runs outside Supabase so the schedule is independent of the project.
#
# CURRENT REALITY (audited 2026-06-11):
#   - The LIVE project the app actually uses is `yohewfdafdmwntsbzgxx` — it is
#     the app's EXPO_PUBLIC_SUPABASE_URL, the CLI-linked project, and where all
#     migrations + content live. Its keepalive is REQUIRED below.
#   - `tirxigmycjuhaecmbygs` ("ReviewNatin PH") is the PLANNED dedicated prod
#     project from docs/06-app-store-production.md, but it is NOT provisioned
#     yet (DNS returns NXDOMAIN). Its keepalive is best-effort / non-fatal so
#     this workflow does not fail while that project does not exist. Once it is
#     created and `REVIEWNATIN_PH_SUPABASE_ANON_KEY` is set, it will be pinged.
#
# Required GitHub secret:
# - APP_LINKED_SUPABASE_ANON_KEY
#   Supabase Dashboard -> project `yohewfdafdmwntsbzgxx` -> Project Settings ->
#   API -> Project API keys -> anon public
#
# Optional GitHub secret (only once the planned prod project exists):
# - REVIEWNATIN_PH_SUPABASE_ANON_KEY  (project `tirxigmycjuhaecmbygs`)

on:
  schedule:
    # Four times per day. This is intentionally much more frequent than the
    # 7-day inactivity window to cover delayed or skipped GitHub cron runs.
    - cron: '11 0 * * *'
    - cron: '11 6 * * *'
    - cron: '11 12 * * *'
    - cron: '11 18 * * *'
  workflow_dispatch:

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping-live-app-project:
    name: Keep the LIVE app Supabase project active (required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Query the live app database through PostgREST
        env:
          SUPABASE_URL: https://yohewfdafdmwntsbzgxx.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.APP_LINKED_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing APP_LINKED_SUPABASE_ANON_KEY. This is the LIVE project the app uses (yohewfdafdmwntsbzgxx) and MUST be kept alive. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          URL="${SUPABASE_URL}/rest/v1/keepalive_pings?select=id,label&limit=1"
          echo "Querying the live app Supabase project at ${SUPABASE_URL}"
          HTTP_CODE="$(
            curl --silent --show-error --location \
              --max-time 30 \
              --output /tmp/supabase-keepalive.json \
              --write-out "%{http_code}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "Accept: application/json" \
              "${URL}"
          )"

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/supabase-keepalive.json
          echo

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Supabase keepalive failed for the live project yohewfdafdmwntsbzgxx. Expected 2xx from PostgREST."
            exit 1
          fi

          echo "Live app Supabase keepalive succeeded at $(date -u '+%Y-%m-%d %H:%M:%S UTC')."

  ping-planned-prod-project:
    name: Keep planned prod project active (best-effort, not yet provisioned)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Query the planned prod database if it exists and its secret is set
        env:
          SUPABASE_URL: https://tirxigmycjuhaecmbygs.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.REVIEWNATIN_PH_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::notice::REVIEWNATIN_PH_SUPABASE_ANON_KEY is not set. The dedicated prod project (tirxigmycjuhaecmbygs) is not in use yet — skipping."
            exit 0
          fi

          URL="${SUPABASE_URL}/rest/v1/keepalive_pings?select=id,label&limit=1"
          echo "Querying the planned prod Supabase project at ${SUPABASE_URL}"
          HTTP_CODE="$(
            curl --silent --show-error --location \
              --max-time 30 \
              --output /tmp/supabase-keepalive-prod.json \
              --write-out "%{http_code}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "Accept: application/json" \
              "${URL}" || true
          )"

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/supabase-keepalive-prod.json 2>/dev/null || true
          echo

          # Non-fatal: this project is not provisioned yet (DNS NXDOMAIN gives
          # HTTP 000). Warn instead of failing the whole workflow so the live
          # keepalive above is never blocked by the not-yet-existing prod project.
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::warning::Planned prod project tirxigmycjuhaecmbygs returned HTTP ${HTTP_CODE} (likely not provisioned yet). Skipping without failing."
            exit 0
          fi

          echo "Planned prod Supabase keepalive succeeded at $(date -u '+%Y-%m-%d %H:%M:%S UTC')."

  repo-heartbeat:
    name: Repo heartbeat to keep scheduled workflows enabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit heartbeat only if repo has been quiet for 25+ days
        run: |
          set -euo pipefail

          LAST_COMMIT_TS="$(git log -1 --format=%ct)"
          NOW_TS="$(date -u +%s)"
          AGE_DAYS="$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))"
          echo "Last repository activity was ${AGE_DAYS} day(s) ago."

          if [ "${AGE_DAYS}" -lt 25 ]; then
            echo "Repository is active. No heartbeat commit needed."
            exit 0
          fi

          mkdir -p .github
          echo "Last automated keepalive heartbeat: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive-heartbeat.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-heartbeat.txt
          git commit -m "chore(ci): keep scheduled keepalive active [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
