<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A72FF"/>
      <stop offset="100%" stop-color="#08245C"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EFFF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Subtle top highlight -->
  <rect x="10" y="6" width="80" height="30" rx="14" fill="white" fill-opacity="0.06"/>

  <!-- Left page (short leg of checkmark): spine(50,62) → tip(22,78) -->
  <path d="M46.53,55.92 L18.53,71.92 L25.47,84.08 L53.47,68.08 Z" fill="url(#pg)"/>
  <circle cx="22" cy="78" r="6.3" fill="url(#pg)"/>

  <!-- Right page (long diagonal of checkmark): spine(50,62) → tip(78,28) -->
  <path d="M55.40,66.45 L83.40,32.45 L72.60,23.55 L44.60,57.55 Z" fill="url(#pg)"/>
  <circle cx="78" cy="28" r="6.3" fill="url(#pg)"/>

  <!-- Spine junction dot -->
  <circle cx="50" cy="62" r="5.95" fill="url(#pg)"/>

  <!-- Gold 6-point star above spine -->
  <path d="M50,17.5 L51.6,22.23 L56.5,21.25 L53.2,25 L56.5,28.75 L51.6,27.77 L50,32.5 L48.4,27.77 L43.5,28.75 L46.8,25 L43.5,21.25 L48.4,22.23 Z" fill="#FFC928"/>
</svg>
