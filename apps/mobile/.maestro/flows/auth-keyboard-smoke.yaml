# Auth keyboard smoke: fields accept input via label or placeholder tap
# Avoid hideKeyboard — Maestro often cannot dismiss Android soft keyboard on API 35.
appId: ph.reviewnatin.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ReviewNatin"
    timeout: 30000
- openLink: reviewnatin://signup
- extendedWaitUntil:
    visible: "Gumawa ng account"
    timeout: 20000
- extendedWaitUntil:
    visible: "Google sign-in skips the email code"
    timeout: 10000
- tapOn:
    text: "Name"
    optional: true
- tapOn:
    text: "Pangalan mo"
    optional: true
- inputText: "Mara Santos"
- tapOn:
    text: "Email"
    optional: true
- tapOn:
    text: "e.g. reviewer@email.com"
    optional: true
- inputText: "f1.agent@reviewnatinph.com"
- tapOn:
    text: "Password"
    optional: true
- tapOn:
    text: "Create a password"
    optional: true
- inputText: "ReviewNatin1"
- openLink: reviewnatin://login
- extendedWaitUntil:
    visible: "Log in"
    timeout: 15000
- tapOn:
    text: "Email"
    optional: true
- tapOn:
    text: "e.g. reviewer@email.com"
    optional: true
- inputText: "f1.agent@reviewnatinph.com"
- tapOn:
    text: "Password"
    optional: true
- tapOn:
    text: "Enter your password"
    optional: true
- inputText: "ReviewNatin1"
