# Guest cohort smoke: welcome → onboarding → dashboard → Review tab
appId: ph.reviewnatin.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ReviewNatin"
    timeout: 30000
- extendedWaitUntil:
    visible: "Get started — it's free"
    timeout: 15000
- tapOn: "Get started — it's free"
- extendedWaitUntil:
    visible: "Continue →"
    timeout: 10000
- tapOn: "Continue →"
- tapOn: "Continue →"
- tapOn: "I'm committed →"
- tapOn: "Skip muna (guest)"
- extendedWaitUntil:
    visible: "Pumunta sa Dashboard"
    timeout: 10000
- tapOn: "Pumunta sa Dashboard"
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- extendedWaitUntil:
    visible: "Simulan dito — libre, walang signup"
    timeout: 15000
- assertVisible: "Mag-practice ngayon"
- tapOn: "Review"
- extendedWaitUntil:
    visible: "Start practice quiz"
    timeout: 10000
