# Premium cohort smoke: guest onboarding → subscribe paywall shows Plus plans
appId: ph.reviewnatin.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ReviewNatin"
    timeout: 30000
- extendedWaitUntil:
    visible: "Get started — it's free"
    timeout: 15000
- tapOn: "Get started — it's free"
- extendedWaitUntil:
    visible: "Continue →"
    timeout: 10000
- tapOn: "Continue →"
- tapOn: "Continue →"
- tapOn: "I'm committed →"
- tapOn: "Skip muna (guest)"
- tapOn: "Pumunta sa Dashboard"
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- openLink: reviewnatin://subscribe
- extendedWaitUntil:
    visible: "Lahat ng kailangan mo"
    timeout: 15000
- assertVisible: "Hindi affiliated sa CSC"
- assertVisible: "Mag-log in para mag-subscribe"
