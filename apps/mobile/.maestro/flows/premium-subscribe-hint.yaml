# Premium cohort smoke: subscribe paywall shows Plus plans (web checkout on APK beta)
appId: ph.reviewnatin.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Magpatuloy bilang guest"
    timeout: 15000
- tapOn: "Magpatuloy bilang guest"
- extendedWaitUntil:
    visible: "Get started — it's free"
    timeout: 10000
- tapOn: "Get started — it's free"
- tapOn: "Continue →"
- tapOn: "Continue →"
- tapOn: "I'm committed →"
- tapOn: "Skip muna (guest)"
- tapOn: "Pumunta sa Dashboard"
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- scrollUntilVisible:
    element: "Full mocks"
    direction: DOWN
    timeout: 10000
- tapOn: "Full mocks"
- extendedWaitUntil:
    visible: "Choose a plan"
    timeout: 15000
- assertVisible: "Choose a plan"
