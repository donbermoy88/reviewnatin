# Premium cohort smoke: guest onboarding → subscribe paywall shows Plus plans
appId: ph.reviewnatin.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Get started — it's free"
    timeout: 15000
- tapOn: "Get started — it's free"
- extendedWaitUntil:
    visible: "Continue →"
    timeout: 10000
- tapOn: "Continue →"
- tapOn: "Continue →"
- tapOn: "I'm committed →"
- tapOn: "Skip muna (guest)"
- tapOn: "Pumunta sa Dashboard"
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- scrollUntilVisible:
    element: "See ReviewNatin Plus plans"
    direction: DOWN
    timeout: 15000
- tapOn: "See ReviewNatin Plus plans"
- extendedWaitUntil:
    visible: "Mag-log in para mag-subscribe"
    timeout: 15000
- assertVisible: "Mag-log in para mag-subscribe"
