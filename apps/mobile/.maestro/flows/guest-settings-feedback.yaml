# G4 smoke: Profile → Settings → Report a problem (guest)
appId: ph.reviewnatin.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ReviewNatin"
    timeout: 30000
- extendedWaitUntil:
    visible: "Get started — it's free"
    timeout: 15000
- tapOn: "Get started — it's free"
- extendedWaitUntil:
    visible: "Anong exam ang nire-review mo?"
    timeout: 15000
- extendedWaitUntil:
    visible: "Continue →"
    timeout: 10000
- tapOn: "Continue →"
- extendedWaitUntil:
    visible: "Ano ang level mo ngayon?"
    timeout: 10000
- tapOn: "Continue →"
- extendedWaitUntil:
    visible: "Itakda ang daily goal mo"
    timeout: 10000
- tapOn: "I'm committed →"
- extendedWaitUntil:
    visible: "I-save ang progress mo"
    timeout: 15000
- scrollUntilVisible:
    element: "Skip muna (guest)"
    direction: DOWN
    timeout: 20000
- tapOn: "Skip muna (guest)"
- extendedWaitUntil:
    visible: "Pumunta sa Dashboard"
    timeout: 10000
- tapOn: "Pumunta sa Dashboard"
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Open settings"
    timeout: 20000
- tapOn: "Open settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- scrollUntilVisible:
    element: "Report a problem"
    direction: DOWN
    timeout: 20000
- tapOn: "Report a problem"
