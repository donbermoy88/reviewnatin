# Free cohort smoke: OTP verification UI + signup form (email delivery needs SMTP)
# Run after: adb shell pm clear ph.reviewnatin.app
appId: ph.reviewnatin.app
---
- openLink: reviewnatin://verify-email?email=f1.agent@reviewnatinph.com
- extendedWaitUntil:
    visible: "I-verify ang email"
    timeout: 20000
- openLink: reviewnatin://signup
- extendedWaitUntil:
    visible: "Gumawa ng account"
    timeout: 15000
